[package]
name = "kani-lease"
version = "1.0.0-rc.4"
license.workspace = true
repository.workspace = true
edition = "2024"

[dependencies]
workspace-hack = { version = "0.1", path = "../workspace-hack" }

# `loom` model-checks the lease/drain coordination. Only pulled in under
# `--cfg loom`; run: RUSTFLAGS="--cfg loom" cargo test -p kani-lease
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["workspace-hack"]
