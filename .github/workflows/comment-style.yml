name: Comment style

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test comment scanner
        run: node --test scripts/check-comment-style.test.mjs
      - name: Check comments
        run: node scripts/check-comment-style.mjs
