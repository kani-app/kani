name: Publish Docker image

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      publish:
        description: "Push and sign the image. False builds it and throws it away."
        required: false
        default: false
        type: boolean
      tag:
        description: "Unused when called; defined so `inputs.tag` resolves."
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.9.0)"
        required: true
        type: string
      plan:
        description: "Unused when dispatched; defined so `inputs.plan` resolves."
        required: false
        default: ""
        type: string
      publish:
        description: "Push and sign the image."
        required: false
        default: true
        type: boolean

jobs:
  # Resolved once and shared, so the two architecture builds and the merge all
  # agree without recomputing it three times.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      image: ${{ steps.v.outputs.image }}
    steps:
      - name: Resolve version
        id: v
        env:
          PLAN: ${{ inputs.plan }}
          DISPATCH_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' || inputs.publish }}
        run: |
          if [ -n "$PLAN" ]; then
            TAG=$(echo "$PLAN" | jq -r '.announcement_tag // empty')
          else
            TAG="$DISPATCH_TAG"
          fi
          # A rehearsal has no tag to announce; name it so nothing collides with
          # a real release even if a push is ever enabled by mistake.
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            TAG="v0.0.0-rehearsal"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, not by tag: a tag points at one manifest, so two jobs
      # pushing the same tag would race and the loser's architecture would
      # simply vanish. The merge job assembles the digests afterwards.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.version.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ needs.version.outputs.publish }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          # Scoped per architecture: a shared scope means the two jobs evict
          # each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: true
          sbom: true

      - name: Record the digest
        if: needs.version.outputs.publish == 'true'
        run: |
          mkdir -p /tmp/digests
          echo -n "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - name: Upload the digest
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Assembles the per-architecture digests into one multi-arch tag, then signs
  # that manifest. Signing here rather than per architecture means one
  # signature covers what a user actually pulls.
  merge:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for keyless cosign signing via the GitHub OIDC provider.
      id-token: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch manifest
        id: manifest
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          AMD64=$(cat /tmp/digests/amd64)
          ARM64=$(cat /tmp/digests/arm64)
          if [ -z "$AMD64" ] || [ -z "$ARM64" ]; then
            echo "::error::a per-architecture digest is missing (amd64='$AMD64' arm64='$ARM64')"
            exit 1
          fi
          TAGS="-t ${IMAGE}:${VERSION}"
          # A prerelease must never move the `latest` tag.
          if [ "$PRERELEASE" = "false" ]; then
            TAGS="$TAGS -t ${IMAGE}:latest"
          fi
          docker buildx imagetools create $TAGS "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"
          D=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$D" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          IMAGE: ${{ needs.version.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify the signature we just made
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          IMAGE: ${{ needs.version.outputs.image }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      # The manifest is the whole point of splitting the build; assert it rather
      # than assume imagetools did what was intended.
      - name: Confirm both architectures are present
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          M=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --raw)
          for arch in amd64 arm64; do
            echo "$M" | jq -e --arg a "$arch" '.manifests[] | select(.platform.architecture == $a)' >/dev/null \
              || { echo "::error::manifest is missing linux/$arch"; exit 1; }
          done
          echo "manifest carries linux/amd64 and linux/arm64"

      # GHCR never prunes the untagged digests and attestations each publish
      # leaves behind. Runs last so a failure here cannot lose a release that
      # is already pushed, signed and verified.
      - name: Prune superseded untagged versions
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: kani
          package-type: container
          delete-only-untagged-versions: true
          # An untagged digest is not spare: cosign verify and provenance
          # resolve through them. One publish leaves about a dozen, so this
          # keeps roughly the last three releases verifiable.
          min-versions-to-keep: 40
