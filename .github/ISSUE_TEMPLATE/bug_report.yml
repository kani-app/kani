name: Bug report
description: Report unexpected or incorrect behaviour
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a bug report, check [existing issues](https://github.com/kani-app/kani/issues) to avoid duplicates.

  - type: input
    id: version
    attributes:
      label: Kani version
      description: Run `docker inspect kani | grep -i version` or check Settings → Server.
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Docker (Compose)
        - Docker (standalone)
        - Binary / local build
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and its effect.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Remove credentials, tokens, cookies, and private URLs before submitting.
      render: text
