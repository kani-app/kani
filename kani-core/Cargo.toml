[package]
name = "kani-core"
version = "1.0.0-rc.4"
license.workspace = true
repository.workspace = true
edition = "2024"
build = "build.rs"

[lints]
workspace = true

[features]
test-util = []

[dependencies]
kani-shared = { path = "../kani-shared", features = ["host"] }

# Async runtime
tokio = { version = "1.49.0", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros", "process"] }
futures.workspace = true
tokio-util = { workspace = true, features = ["compat"] }

# HTTP client
rquest = { package = "wreq", version = "6.0.0-rc.29", features = ["form", "json"] }
rquest-util = { package = "wreq-util", version = "3.0.0-rc.14" }
http-body-util = "0.1"
governor.workspace = true

# WASM runtime
wasmtime = { version = "46.0.1", features = ["async", "component-model"] }

# Serialization
serde.workspace = true
serde_json.workspace = true
postcard = { version = "1", features = ["alloc"] }
quick-xml = { version = "0.39.2", features = ["serialize"] }
base64 = "0.22"
sha2.workspace = true
ed25519-dalek.workspace = true
hex = "0.4"

# HTML parsing (for extensions)
scraper = "0.25.0"

# Error handling
thiserror.workspace = true

# Archive handling
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
async_zip = { version = "0.0.18", features = ["tokio"] }
dunce = "1"

# Image dimension reading and pixel sampling (spread detection at CBZ creation)
imagesize = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Scripting
rhai = { version = "1.19", features = ["sync"] }

# Logging
tracing.workspace = true
async-trait = "0.1"

bytes.workspace = true
arc-swap = "1.8.2"
ego-tree = "^0.10.0"
hickory-resolver = "0.25.2"
dashmap.workspace = true
publicsuffix = "2.3.0"
url = "2.5.8"
urlencoding.workspace = true
time = { workspace = true, features = ["parsing"] }
regex = "1.12.3"
rand = "0.10.0"
blake3 = "1.8.5"
stacker = "0.1"
workspace-hack = { version = "0.1", path = "../workspace-hack" }


[dev-dependencies]
kani-core = { path = ".", features = ["test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }
kani-shared = { path = "../kani-shared", features = ["builder"] }
kani-yaml = { path = "../kani-yaml" }
serde_yaml = "0.9"
tempfile = "3.27.0"
tokio = { version = "1", features = ["test-util"] }
tokio-test = "0.4"
wiremock = "0.6"

[[bench]]
name = "blueprint_eval"
harness = false

[package.metadata.cargo-machete]
ignored = ["workspace-hack"]
