<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kani</title>
  <script>
    (function () {
      var h = document.documentElement;
      var theme   = localStorage.getItem('kani-theme')   || 'system';
      var density = localStorage.getItem('kani-density') || '';
      var accent  = localStorage.getItem('kani-accent')  || '';
      if (density === 'compact') h.setAttribute('data-density', 'compact');
      // Custom named theme: apply all stored token overrides before first paint.
      // Tokens include pre-computed accent-hover/dim so no math is needed here.
      if (theme && theme.indexOf('custom:') === 0) {
        try {
          var customs = JSON.parse(localStorage.getItem('kani-custom-themes') || '[]');
          var ct = customs.find(function (t) { return t.id === theme.slice(7); });
          if (ct && ct.tokens) {
            for (var k in ct.tokens) h.style.setProperty(k, ct.tokens[k]);
          }
        } catch (_) {}
        return;
      }
      if (theme === 'system') {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
          h.setAttribute('data-theme', 'light');
      } else if (theme === 'light' || theme === 'black') {
        h.setAttribute('data-theme', theme);
      }
      if (accent && accent !== '#e0523f') {
        var r = parseInt(accent.slice(1, 3), 16);
        var g = parseInt(accent.slice(3, 5), 16);
        var b = parseInt(accent.slice(5, 7), 16);
        var d = function (n) { return Math.max(0, Math.round(n * 0.84)).toString(16).padStart(2, '0'); };
        h.style.setProperty('--color-accent',       accent);
        h.style.setProperty('--color-accent-hover', '#' + d(r) + d(g) + d(b));
        h.style.setProperty('--color-accent-dim',   'rgba(' + r + ',' + g + ',' + b + ',0.15)');
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script type="importmap">
  {
    "imports": {
      "preact": "/js/vendor/preact.module.js",
      "preact/hooks": "/js/vendor/preact-hooks.module.js",
      "htm": "/js/vendor/htm.module.js",
      "@preact/signals-core": "/js/vendor/signals-core.module.js",
      "@preact/signals": "/js/vendor/signals.module.js",
      "preact/compat": "/js/vendor/compat.module.js",
      "preact/debug": "/js/vendor/debug.module.js",
      "preact/devtools": "/js/vendor/devtools.module.js"
    }
  }
  </script>
</head>
<body class="bg-bg text-text antialiased">
  <a href="#app" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-100 focus:px-4 focus:py-2 focus:bg-accent focus:text-white focus:rounded-md focus:text-sm focus:font-medium focus:shadow-lg">Skip to content</a>
  <div class="shell">
    <aside id="nav" role="navigation" aria-label="Main navigation"></aside>
    <main id="app" class="shell-main pb-20 md:pb-0 min-h-screen" tabindex="-1"></main>
  </div>
  <nav id="bottom-nav" aria-label="Main navigation"></nav>
  <div id="modal-root"></div>
  <div id="popover-root"></div>
  <!-- Only this shell serves raw modules. esbuild replaces the identifier with
       false for the bundle, so dev-only routes leave no chunk in a release. -->
  <script>globalThis.__KANI_DEV__ = true;</script>
  <script type="module" src="/js/dev-debug.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
